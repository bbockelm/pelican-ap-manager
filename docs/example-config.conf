# Example HTCondor configuration for Pelican Manager with Web Server

# Core pelican manager settings
PELICAN_MANAGER_POLL_INTERVAL = 30s
PELICAN_MANAGER_ADVERTISE_INTERVAL = 1m
PELICAN_MANAGER_EPOCH_LOOKBACK = 24h
PELICAN_MANAGER_STATS_WINDOW = 1h
PELICAN_MANAGER_DIRECTOR_CACHE_TTL = 15m

# Database and state paths
PELICAN_MANAGER_STATE_PATH = $(SPOOL)/pelican_state.json
PELICAN_MANAGER_INFO_PATH = $(SPOOL)/pelican_info.json

# Collector and schedd configuration
PELICAN_MANAGER_COLLECTOR_HOST = $(COLLECTOR_HOST)
PELICAN_MANAGER_SCHEDD_NAME = $(SCHEDD_NAME)

# Site attribute for job routing
PELICAN_MANAGER_SITE_ATTRIBUTE = MachineAttrGLIDEIN_ResourceName0

# Job mirror (optional)
# PELICAN_MANAGER_JOB_MIRROR_PATH = $(SPOOL)/pelican_job_mirror

# Web server configuration
# Socket defaults to $(SPOOL)/pelican_manager.sock if not specified
# PELICAN_REGISTRATION_SOCKET = $(SPOOL)/pelican_manager.sock

# Address file defaults to $(LOG)/.pelican_manager_address if not specified
# PELICAN_MANAGER_ADDRESS_FILE = $(LOG)/.pelican_manager_address

# TCP/HTTP listen address (uncomment to use instead of Unix socket)
# PELICAN_MANAGER_WEB_LISTEN_ADDRESS = :8080

# TLS configuration for TCP/HTTP mode
# (TLS certificates will be auto-generated if not provided)
# PELICAN_MANAGER_WEB_TLS_CERT = /etc/pelican/cert.pem
# PELICAN_MANAGER_WEB_TLS_KEY = /etc/pelican/key.pem

# Optional: Custom database path
# PELICAN_MANAGER_WEB_DB_PATH = $(SPOOL)/pelican_web.db

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# What the daemon does with the limits it derives:
#   enforcing (default) - install both the static rules below and the limits
#                         the control loop derives from observed performance.
#   observing           - compute and publish the control loop's conclusions in
#                         the summary ads, but install only the static rules.
#                         Use this to evaluate the controller against a real
#                         workload while keeping a few hand-written limits in
#                         force.
# PELICAN_MANAGER_ENFORCEMENT_MODE = observing

# Static rate rules. These are the operator's own policy: they are installed in
# every enforcement mode, including "observing". Name them in the list macro,
# then give each one a body in PELICAN_MANAGER_RATE_RULE_<NAME> (upper-cased).
#
# Rule body keys (any order):
#   user=<owner>      job owner; "*" or omitted matches any
#   site=<site>       execution site, matched against the site attribute above;
#                     "*" or omitted matches any
#   sources=<a,b>     only jobs whose PelicanInputPrefixes name one of these
#   rate=<n>          jobs allowed per window; 0 means count without blocking
#   window=<dur>      rate window (default 60s)
#   expires=<dur>     retire the rule this long from now (default: never)
#   disabled=<bool>   keep the rule on file without installing it
#   expr=<classad>    raw ClassAd expression, replacing user/site/sources
#   note="..."        free-form commentary, carried into the store and logs
#
# PELICAN_MANAGER_RATE_RULES = ligo_ucsd, psu_all
# PELICAN_MANAGER_RATE_RULE_LIGO_UCSD = user=ligo site=UCSD rate=20 window=60s
# PELICAN_MANAGER_RATE_RULE_PSU_ALL   = site=PSU-LIGO rate=5 window=2m note="incident 4471"

# Where the rate rules live. By default a JSON document under SPOOL. Point
# PELICAN_MANAGER_RULE_DB_ADDRESS at an htcondordb daemon to keep them in the
# pool database instead, where htcondordb-cli and friends can read and edit
# them.
# PELICAN_MANAGER_RULE_STORE_PATH = $(SPOOL)/pelican_rate_rules.json
# PELICAN_MANAGER_RULE_DB_ADDRESS = htcondordb.example.org:9618
# PELICAN_MANAGER_RULE_DB_TABLE   = pelican_rate_rules
