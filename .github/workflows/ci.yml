name: CI

# Every pull request, not just those targeting main: a stacked PR (one based on
# another feature branch) would otherwise get no CI at all, which is exactly when
# the base is least settled.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        env:
          # The sibling modules are private; fetch their tags straight from
          # GitHub rather than through the module proxy.
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: go mod download

      - name: Vet
        run: go vet ./...

      # The integration- and condor-tagged sources are excluded from a plain
      # `go vet ./...`, so they rot silently unless checked explicitly.
      - name: Vet build-tagged sources
        run: go vet -tags integration,condor ./...

      - name: Test
        run: go test -short ./...

      # Both binaries must build. pelican_web is the standalone HTTP daemon;
      # nothing in the test suite links its main package, so without this a
      # break there would only surface at release time.
      - name: Build binaries
        run: make build
