name: Lint

# Every pull request, not just those targeting main: a stacked PR (one based on
# another feature branch) would otherwise get no CI at all, which is exactly when
# the base is least settled.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=5m

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          gofmt -l $(go list -f '{{.Dir}}' ./...) > /tmp/gofmt.out
          if [ -s /tmp/gofmt.out ]; then
            echo "Go files need formatting:" && cat /tmp/gofmt.out
            exit 1
          fi
