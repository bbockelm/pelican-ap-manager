name: Integration Tests

# Every pull request, not just those targeting main: a stacked PR (one based on
# another feature branch) would otherwise get no CI at all, which is exactly when
# the base is least settled.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# NOTE: this job installs no HTCondor, so every test that needs a real
# condor_master skips here -- TestPelicanIntegration, TestPelicanManagedDaemon,
# TestFakeTransferPluginIntegration and the static-rule tests among them. What
# actually runs is the handful that does not need a pool.
#
# The privileged path is covered by root-integration.yml, but that job is root and
# those tests cannot run as root as written. Until this job has an unprivileged
# HTCondor, they are exercised only by hand. Adding one here is the fix; it needs
# HTCondor installed on a non-root runner and a personal-condor pool.

jobs:
  integration:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Download modules
        env:
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: go mod download

      - name: Run integration tests
        run: gotestsum --format testname -- -v -tags integration ./integration/...
