name: release

# Builds pelican-man and pelican-web for the platforms an access point is actually
# deployed on -- linux/amd64 and linux/arm64 -- plus darwin/arm64, which is where this
# gets developed and hand-tested. No darwin/amd64: condor_master does not run on an
# Intel Mac in any deployment, and it was 18 MB of release assets nobody downloads.
#
# The archives are attached to the GitHub release when a v* tag is pushed. The module
# consumes its sibling modules (classad, cedar, golang-htcondor, htcondordb) from
# published tags, so no sibling checkout is needed -- GOPRIVATE makes `go build` fetch
# them directly from GitHub.
#
# A manual run (workflow_dispatch) builds and uploads the archives as workflow artifacts
# WITHOUT publishing a release, so the build can be exercised without cutting a tag.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    name: Build binaries and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release archives (linux/amd64, linux/arm64, darwin/arm64)
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
          # Fetch the bbockelm/PelicanPlatform module tags directly from GitHub (bypass the
          # module proxy + checksum DB) so a just-pushed dependency tag resolves immediately.
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: |
          set -euo pipefail
          # workflow_dispatch has no tag to name the build after.
          version="${GITHUB_REF_NAME}"
          case "${GITHUB_REF}" in
            refs/tags/*) ;;
            *) version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)" ;;
          esac
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="pelican-ap-manager_${version}_${os}_${arch}"
            echo "==> building ${name}"
            stage="dist/${name}"

            # The archive mirrors an install prefix rather than being a flat bag
            # of files, so deploying on an AP is one command:
            #
            #   tar -xzf <archive>.tar.gz --strip-components=1 -C /usr
            #
            # which puts the daemons in /usr/sbin (where condor_master expects
            # its daemons) and the docs under /usr/share/doc. The config example
            # deliberately does NOT land in /etc/condor/config.d: dropping it
            # there would start both daemons on the next condor_reconfig, which
            # is the admin's decision, not the tarball's.
            mkdir -p "${stage}/sbin" "${stage}/share/doc/pelican-ap-manager"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${stage}/sbin/" ./cmd/pelican-man ./cmd/pelican-web
            cp README.md "${stage}/share/doc/pelican-ap-manager/"
            cp docs/example-config.conf "${stage}/share/doc/pelican-ap-manager/"
            cp docs/WEBSERVER.md docs/control-algorithm.md docs/deployment-example.md \
              "${stage}/share/doc/pelican-ap-manager/" 2>/dev/null || true
            cp packaging/99-pelican-manager.conf "${stage}/share/doc/pelican-ap-manager/"

            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            rm -rf "${stage}"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          echo "Built archives:"; ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pelican-ap-manager-binaries
          path: dist/*
          if-no-files-found: error

      # Only on a v* tag: create the GitHub release (if absent) and attach the archives and
      # checksums. Uses the runner's built-in gh CLI -- no third-party action. A tag with a
      # pre-release suffix (v1.0.0-rc1) is marked as a pre-release.
      - name: Publish release with binaries
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          assets=(dist/*.tar.gz dist/SHA256SUMS.txt)
          # Idempotent: attach to an existing release (e.g. one created by hand or a
          # re-run) instead of failing; otherwise create it. --clobber replaces assets
          # so re-runs are safe.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} exists; uploading assets (clobbering any existing)."
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            prerelease=""
            case "${tag}" in
              *-*) prerelease="--prerelease" ;;
            esac
            # Draft, not published: publishing a release is a deliberate human
            # act, and a draft can be inspected (and its assets downloaded)
            # before anyone can consume it.
            gh release create "${tag}" "${assets[@]}" \
              --draft \
              --title "${tag}" \
              --generate-notes \
              ${prerelease}
          fi
