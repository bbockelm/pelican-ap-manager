name: Test

# Every pull request, not just those targeting main: a stacked PR (one based on
# another feature branch) would otherwise get no CI at all, which is exactly when
# the base is least settled.
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Download modules
        env:
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: go mod download

      - name: Run unit tests
        run: gotestsum --format testname -- -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false
        continue-on-error: true
