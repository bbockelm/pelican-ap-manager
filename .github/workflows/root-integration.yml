name: root integration

# Runs the privileged end-to-end test: condor_master starts pelican_man and
# pelican_web as root, both drop to the condor user, the manager installs the
# operator's static rate rules as schedd startup limits, and the web daemon
# serves a sandbox registration.
#
# This needs a real HTCondor and a real root, so it runs in an AlmaLinux
# container with HTCondor installed from the same repository the devcontainer
# uses. A GitHub Actions container job runs as root, and the HTCondor package
# creates the condor user -- which is the identity the daemons must drop to.
#
# PELICAN_REQUIRE_ROOT_TEST=1 makes "cannot run as root" a failure rather than a
# skip, so a broken runner cannot silently stop covering the privileged path.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-integration:
    name: Static rules enforced as root
    runs-on: ubuntu-latest
    container:
      image: almalinux:9
      # SYS_ADMIN is not needed; the daemons only need to setuid, which root has.
      options: --hostname pelican-ci.localdomain

    steps:
      - name: Install HTCondor and Go
        run: |
          set -euxo pipefail
          dnf install -y 'dnf-command(config-manager)'
          dnf config-manager --set-enabled crb
          dnf install -y epel-release
          curl -fsSL -o /etc/yum.repos.d/htcondor-release-current.el9.noarch.rpm \
            https://htcss-downloads.chtc.wisc.edu/repo/25.x/htcondor-release-current.el9.noarch.rpm
          dnf install -y /etc/yum.repos.d/htcondor-release-current.el9.noarch.rpm
          dnf install -y --allowerasing condor golang git tar which procps-ng
          # The condor package creates the account the daemons drop to; fail
          # loudly here rather than letting the test skip.
          id condor
          # A separate ordinary account to submit jobs as. Neither root nor the
          # condor daemon account may own HTCondor jobs.
          useradd --create-home pelicansubmit
          id pelicansubmit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build both daemons
        env:
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make build

      - name: Run the root integration test
        env:
          PELICAN_REQUIRE_ROOT_TEST: '1'
          GOPRIVATE: github.com/bbockelm,github.com/PelicanPlatform
        run: |
          set -euxo pipefail
          test "$(id -u)" -eq 0 || { echo "this job must run as root"; exit 1; }
          export PATH="/usr/sbin:/usr/bin:$PATH"
          export PELICAN_MANAGER_BINARY="$PWD/bin/pelican_man"
          export PELICAN_WEB_BINARY="$PWD/bin/pelican_web"
          go test -tags integration -v -timeout 25m \
            -run '^TestRootStaticRuleEnforcement$' ./integration/

      - name: Upload daemon logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-integration-logs
          # t.TempDir() lands under TMPDIR (/tmp in the container), which is
          # where each daemon's log directory lives; /tmp/pelroot_* holds only
          # the sockets.
          path: |
            /tmp/TestRootStaticRuleEnforcement*/
          if-no-files-found: ignore
          retention-days: 3
