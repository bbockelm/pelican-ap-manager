version: 2

updates:
  # Keep the SHA pins in .github/workflows current. Pinning stops a tag being
  # moved under us; this is the other half, so a pinned action still picks up
  # fixes -- Dependabot rewrites both the SHA and its `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    # "/" means .github/workflows, not a directory to search for manifests.
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # actions/checkout alone appears in every workflow, so ungrouped updates
      # would open a pull request per action per week.
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions

  # Go modules, except the modules developed alongside this repo (classad,
  # htcondordb, golang-htcondor, cedar): those are bumped as a set, by hand,
  # when a matching change lands on both sides, so they are ignored here.
  # Security updates ignore this list by GitHub's own rules, so an advisory
  # against one of them still arrives as a PR.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "github.com/PelicanPlatform/classad*"
      - dependency-name: "github.com/bbockelm/cedar"
      - dependency-name: "github.com/bbockelm/golang-htcondor*"
      - dependency-name: "github.com/bbockelm/htcondordb*"
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - go
