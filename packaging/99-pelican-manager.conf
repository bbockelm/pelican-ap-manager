# Pelican AP manager: drop-in HTCondor configuration.
#
# Install to /etc/condor/config.d/99-pelican-manager.conf and run
# `condor_reconfig; condor_restart -daemon MASTER`.
#
# The distribution tarball deliberately does not install this file for you:
# doing so would start both daemons on the next reconfigure, which is your
# decision rather than the package's.

# ---------------------------------------------------------------------------
# Daemons
# ---------------------------------------------------------------------------

PELICAN_MANAGER = /usr/sbin/pelican_man
PELICAN_WEB     = /usr/sbin/pelican_web

# Tell condor_master to start them...
DAEMON_LIST = $(DAEMON_LIST) PELICAN_MANAGER PELICAN_WEB

# ...and that they are DaemonCore daemons. Without this the master will not
# hand them a shared-port endpoint or a command socket, so condor_ping,
# condor_reconfig -daemon and condor_off -daemon will not reach them and the
# daemons fall back to binding their own port. The leading + appends to the
# built-in list rather than replacing it.
DC_DAEMON_LIST = +PELICAN_MANAGER PELICAN_WEB

# Both daemons are DaemonCore daemons behind the shared port.
USE_SHARED_PORT = True

PELICAN_MANAGER_LOG = $(LOG)/PelicanManagerLog
PELICAN_WEB_LOG     = $(LOG)/PelicanWebLog

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# observing: run the control loop and publish what it concludes, but install
#            only the static rules below. Start here.
# enforcing: also install the limits the control loop derives.
PELICAN_MANAGER_ENFORCEMENT_MODE = observing

# Which machine attribute names the execution site in your pool. Check a real
# machine ad -- `condor_status -l | grep -i site` -- because a site= selector
# that names the wrong attribute silently matches nothing.
PELICAN_MANAGER_SITE_ATTRIBUTE = MachineAttrGLIDEIN_ResourceName0

# Your own rate rules. See `pelican_man -rules` to check they loaded, and
# `pelican_man -limits` to confirm they reached the schedd.
# PELICAN_MANAGER_RATE_RULES          = ligo_ucsd
# PELICAN_MANAGER_RATE_RULE_LIGO_UCSD = user=ligo site=UCSD rate=20 window=60s
