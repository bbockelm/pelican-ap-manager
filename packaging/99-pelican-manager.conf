# Pelican AP manager: drop-in HTCondor configuration.
#
# Install to /etc/condor/config.d/99-pelican-manager.conf and run
# `condor_reconfig; condor_restart -daemon MASTER`.
#
# The distribution tarball deliberately does not install this file for you:
# doing so would start both daemons on the next reconfigure, which is your
# decision rather than the package's.

# ---------------------------------------------------------------------------
# Daemons
# ---------------------------------------------------------------------------

PELICAN_MANAGER = /usr/sbin/pelican_man
PELICAN_WEB     = /usr/sbin/pelican_web

# Tell condor_master to start them...
DAEMON_LIST = $(DAEMON_LIST) PELICAN_MANAGER PELICAN_WEB

# ...and mark them as DaemonCore daemons. This puts them under the master's
# liveness supervision: it expects a DC_CHILDALIVE heartbeat and kills a daemon
# that stops sending one (NOT_RESPONDING_TIMEOUT, an hour by default). Both
# daemons send it, and that supervision is what bounds how long a *hung* manager
# can keep limits alive -- a killed daemon stops renewing their leases.
# The built-in list covers only HTCondor's own daemons, so a third-party one has
# to be added; the leading + appends rather than replacing.
DC_DAEMON_LIST = +PELICAN_MANAGER PELICAN_WEB

# USE_SHARED_PORT is deliberately not set: it has defaulted to true since
# HTCondor 7.5.0, and asserting it here would override a site that turned it off
# on purpose. Both daemons work either way.
#
# Log paths are deliberately not set either: each daemon defaults to
# $(LOG)/<CamelCase subsystem>Log -- PelicanManagerLog and PelicanWebLog. Set
# PELICAN_MANAGER_LOG / PELICAN_WEB_LOG only to put them elsewhere.

# ---------------------------------------------------------------------------
# Rate limiting
# ---------------------------------------------------------------------------

# observing: run the control loop and publish what it concludes, but install
#            only the static rules below. Start here.
# enforcing: also install the limits the control loop derives.
PELICAN_MANAGER_ENFORCEMENT_MODE = observing

# Which machine attribute names the execution site in your pool. Check a real
# machine ad -- `condor_status -l | grep -i site` -- because a site= selector
# that names the wrong attribute silently matches nothing.
PELICAN_MANAGER_SITE_ATTRIBUTE = MachineAttrGLIDEIN_ResourceName0

# Limits carry a short lease, renewed on its own timer at a third of the lease,
# so a crashed daemon cannot leave the AP throttled for long. The schedd caps
# this at STARTUP_LIMIT_MAX_EXPIRATION (5 minutes by default) and clamps
# silently, so raise both together or neither.
# PELICAN_MANAGER_LIMIT_LEASE = 60s

# Your own rate rules. See `pelican_man -rules` to check they loaded, and
# `pelican_man -limits` to confirm they reached the schedd.
# PELICAN_MANAGER_RATE_RULES          = ligo_ucsd
# PELICAN_MANAGER_RATE_RULE_LIGO_UCSD = user=ligo site=UCSD rate=20 window=60s

# ---------------------------------------------------------------------------
# Optional: htcondordb
# ---------------------------------------------------------------------------

# Keep rate rules in the pool database rather than a JSON file under SPOOL, so
# they can be inspected and edited with htcondordb-cli. Use "auto" when
# htcondordb runs on this AP: under condor_master its command address carries a
# pid-derived shared-port socket name, so there is no stable address to write
# down. A host:port is for a remote instance.
# PELICAN_MANAGER_RULE_DB_ADDRESS = auto

# Read history from an htcondordb mirror instead of the schedd -- the single
# biggest load this daemon puts on an access point. Needs scheddsync tailing
# both HISTORY (completed jobs -> "history") and JOB_EPOCH_HISTORY (transfers ->
# "epoch_history"); the table names are overridable with
# PELICAN_MANAGER_EPOCH_DB_JOB_TABLE and _TRANSFER_TABLE. Defaults to the rule
# DB address; on any error the cycle falls back to reading the schedd directly.
# PELICAN_MANAGER_EPOCH_DB_ADDRESS = auto

# Keep the daemon's working state -- read cursors, transfer summaries, the
# control loop's per-pair conclusions -- in htcondordb rather than the SPOOL
# JSON file, so a replacement AP resumes where this one left off. Defaults to
# the rule DB address. Unlike the two above, a failure to read this at startup
# is fatal: coming up with an empty state looks exactly like a first start.
# PELICAN_MANAGER_STATE_DB_ADDRESS = auto
